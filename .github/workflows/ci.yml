name: Offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 offline safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify types, tests, build, reproducibility, and CI policy
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test the installable package
        run: pnpm package:smoke

      - name: Scan tracked files and package contents
        run: pnpm leakage:scan

      - name: Check patch whitespace
        run: git diff --check

  package-portability:
    name: Node 22 package portability
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: "1"
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Test npm and strict pnpm package consumers
        run: pnpm package:smoke
